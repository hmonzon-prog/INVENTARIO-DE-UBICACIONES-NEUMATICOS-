<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocupacion Stock OB</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>Inventario OB</h1>
    <p class="login-sub">Ocupación de Stock</p>
    <form id="loginForm" onsubmit="handleLogin(event); return false;">
      <input type="text" id="loginUser" placeholder="Usuario" autocomplete="username" required>
      <input type="password" id="loginPass" placeholder="Clave" autocomplete="current-password" required>
      <span class="login-error" id="loginError"></span>
      <button type="submit" class="btn login-btn">Ingresar</button>
    </form>
  </div>
</div>

<div class="app-main" id="appMain" style="display:none;">
<div class="header">
  <div class="header-top">
    <h1>Inventario OB — Ocupación de Stock</h1>
    <div class="user-info">
      <span id="currentUser"></span>
      <button class="btn btn-logout" onclick="handleLogout()">Salir</button>
    </div>
  </div>
  <div class="sub" id="fecha"></div>
</div>

<div class="upload-bar">
<label>Reporte de Stock:</label>
<button class="btn" onclick="document.getElementById('stockFile').click()">📂 Seleccionar archivo Excel</button>
<input type="file" id="stockFile" accept=".xlsx,.xls" style="display:none" onchange="handleFile(event)">
<span class="status" id="uploadStatus">⚠️ Sin archivo cargado</span>
<button class="btn" id="btnLimpiar" onclick="limpiarStock()" disabled style="background:#e53935;">✕ Limpiar</button>
<button class="btn" id="btnEjemplo" onclick="cargarEjemplo()" style="background:#1565c0;">🔬 Cargar ejemplo</button>
<button class="btn" onclick="descargarInventariadas()" style="background:#0f9d58;">⬇ Descargar Excel</button>
<button class="btn" onclick="reiniciarInventario()" style="background:#ff6f00;">🔄 Reiniciar Inventario</button>
<button class="btn" onclick="mostrarLog()" style="background:#5e35b1;">📋 Registro de Inventario</button>
</div>

<div id="logModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;justify-content:center;align-items:center;">
<div style="background:#fff;border-radius:10px;padding:20px;max-width:800px;max-height:80vh;overflow:auto;width:90%;">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
<h3 style="margin:0;">Registro de Inventario</h3>
<button onclick="cerrarLog()" style="background:#e53935;color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:700;">✕ Cerrar</button>
</div>
<div id="logContent"></div>
</div>
</div>

<div class="kpi-row" id="kpiRow"></div>

<div class="view-toggle" id="viewToggle">
<button class="active" data-view="inv" onclick="setView('inv')">✅ Progreso Inventario</button>
<button data-view="occ" onclick="setView('occ')">📦 Ocupación Stock</button>
</div>

<div class="map-container">
<h3 style="color:#00796b;font-size:14px;border-bottom:1px solid #e8eaed;padding-bottom:10px;margin-bottom:12px;">Mapa del Depósito</h3>
<div class="legend" id="mapLegend"></div>
<div id="mapaDeposito"></div>
</div>

<div class="charts-row">
<div class="chart-box"><h3 id="chartGenTitle">Progreso General</h3><div class="chart-container"><canvas id="chartGeneral"></canvas></div></div>
<div class="chart-box"><h3 id="chartZonasTitle">Avance por Zona</h3><div class="chart-container"><canvas id="chartZonas"></canvas></div></div>
</div>

<div class="charts-row">
<div class="chart-box"><h3 id="chartBarTitle">Completado vs Restante</h3><div class="chart-container"><canvas id="chartBar"></canvas></div></div>
<div class="chart-box"><h3 id="chartRankTitle">Ranking por Zona</h3><div class="chart-container"><canvas id="chartRanking"></canvas></div></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:25px;">
<div class="chart-box"><h3 id="resumenTitle">Resumen General</h3><div id="resumenTable" style="font-size:13px;"></div></div>
<div class="chart-box"><h3 id="detalleTitle">Detalle por Zona</h3>
<div style="max-height:360px;overflow-y:auto;">
<table style="width:100%;border-collapse:collapse;font-size:12px;" id="tablaZonas">
<thead><tr style="background:#e0f2f1;"><th style="text-align:left;padding:8px;color:#00796b;">Zona</th><th style="text-align:center;padding:8px;color:#00796b;">Total</th><th style="text-align:center;padding:8px;color:#00796b;">Hecho</th><th style="text-align:center;padding:8px;color:#00796b;">Pend</th><th style="text-align:right;padding:8px;color:#00796b;">%</th></tr></thead>
<tbody id="tablaBody"></tbody>
</table></div></div></div>

<h3 style="color:#00796b;font-size:14px;margin-bottom:12px;" id="zoneGridTitle">Detalle por Zona (Tarjetas)</h3>
<div class="zone-grid" id="zoneGrid"></div>
</div>

<script src="config.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
